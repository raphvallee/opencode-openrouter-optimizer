name: CI

on:
  # Only run when a file the verify or install jobs depend on changes.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "vite.config.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "vite.config.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack
        run: npm pack --dry-run

  install:
    name: Install the packed plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack
        run: npm pack

      - name: Install the tarball
        run: |
          mkdir -p /tmp/plugin-install
          cd /tmp/plugin-install
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz

      - name: Resolve both parts
        run: |
          cd /tmp/plugin-install
          node --input-type=module -e "
            const server = import.meta.resolve('opencode-openrouter-optimizer')
            const tui = import.meta.resolve('opencode-openrouter-optimizer/tui')
            console.log('server entry:', server)
            console.log('TUI entry:', tui)
            if (!server.includes('opencode-openrouter-optimizer')) throw new Error('the server entry does not resolve into the package')
            if (!tui.includes('opencode-openrouter-optimizer')) throw new Error('the TUI entry does not resolve into the package')
          "

      - name: Load the server part
        run: |
          cd /tmp/plugin-install
          bun -e "
            const plugin = await import('opencode-openrouter-optimizer')
            if (plugin.default?.id !== 'openrouter-optimizer') throw new Error('the server entry has no plugin id')
            if (typeof plugin.resolveOptions !== 'function') throw new Error('the server entry does not export resolveOptions')
            console.log('server entry loaded:', plugin.default.id)
          "

      - name: Load the TUI part
        run: |
          cd /tmp/plugin-install
          npm install solid-js@1.9.0 --no-save --ignore-scripts > /dev/null
          bun -e "
            const plugin = await import('opencode-openrouter-optimizer/tui')
            if (plugin.default?.id !== 'openrouter-optimizer.tui') throw new Error('the TUI entry has no plugin id')
            console.log('TUI entry loaded:', plugin.default.id)
          "
